<!DOCTYPE html>
<html lang="es">
<html>
<head><meta charset="UTF-8">
<title> Estructura de la web </title>

	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            grid-template-rows: 165px 1fr 60px;
            grid-template-columns: 250px 1fr;
            height: 920px;
            gap: 2px;
        }

        .cabecera {
            grid-column: 1 / -1;
            grid-row: 1;
        }

        .navegador {
            grid-column: 1;
            grid-row: 2;
        }

        .contenido {
            grid-column: 2;
            grid-row: 2;
        }

        .pie {
            grid-column: 1 / -1;
            grid-row: 3;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

</head>
<body>

	<!-- CABECERA -->
    <iframe class="cabecera" src="cabecera.html" name="cabecera"></iframe>

    <!-- NAVEGADOR -->
    <iframe class="navegador" src="navegador.html" name="navegador"></iframe>

    <!-- CONTENIDO -->
    <iframe class="contenido" src="contenido.html" name="contenido"></iframe>

    <!-- PIE DE PÁGINA -->
    <iframe class="pie" src="pie.html" name="pie"></iframe>

</body>
</html>
