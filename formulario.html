<!DOCTYPE html>
<html lang="es">
<html>
<head><meta charset="UTF-8">
<title> Formulario </title>
</head>
<body>

	<h1 align="center"> ASESORÍAS PERSONALES </h1>
	<hr>
	<p> Si desea recibir una asesoría personal, por favor, rellene el segundo formulario. </p>
	<p> Contendios e información sobre la asesoria: </p>
	
	<ul>
		<li> 1h de videollamada. </li>
		<li> Algoritmos complementarios. </li>
		<li> Métodos y sub-métodos para todos los cubos. </li>
	</ul>
	
	<br>
	
	<form>
		<fieldset>
			<legend> Introduzca sus datos aquí: </legend>
			
			<label> Nombre: </label>
			<input type="text" name="nombre" required>
			<br><br>
			
			<label> Apellidos: </label>
			<input type="text" name="apellidos" required>
			<br><br>
			
			<label> Año de nacimiento: </label>
			<input type="date" name="fehca_nacimiento" required>
			<br><br>
			
			<label> DNI: </label>
			<input type="text" name="DNI" required>
			<br><br>
			
			<label> Correo: </label>
			<input type="email" name="correo" required>
			<br><br>
			
			<label> Teléfono: </label>
			<input type="number" name="teléfono" required>
			<br><br>
			
			<label> Fecha para la asesoría: </label>
			<input type="date" name="fecha_asesoría" required>
			<br><br>
			
			<label> Hora para la asesoría: </label>
			<input type="time" name="hora_asesoría" required>
			<br><br>
			
			<label> Cubos sobre los que quiere aprender: </label>
			<input type="text" name="cubos" required>
			<br><br>
			
			<label> Comentarios: </label>
			<input type="text" name="comentarios">
			<br><br>
			
			<input type="submit" name="Enviar">
			<input type="reset" name="Restablecer">
			
		</fieldset>
	</form>

</body>
</html>
