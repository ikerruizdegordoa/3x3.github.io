<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>navegadir</title>
    <style>
        /* Variables para el Tema Claro (Día) */
        :root {
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --link-color: #0284c7;
            --link-hover: #0369a1;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
        }

        /* Variables para el Tema Oscuro (Noche) */
        body.modo-noche {
            --bg-color: #0f172a;
            --text-color: #ffffff;
            --link-color: #38bdf8;
            --link-hover: #7dd3fc;
            --border-color: #334155;
            --btn-bg: #1e293b;
        }

        /* Aplicación de tema inmediata antes de renderizar body */
        html.modo-noche {
            background-color: #0f172a;
            color: #ffffff;
        }

        /* Estilos base */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* Estilo del Botón de Cambio de Tema */
        .contenedor-tema {
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-tema {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-tema:hover {
            border-color: var(--link-color);
        }

        /* Alineación de iconos de cubo */
        li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        img {
            border-radius: 4px;
            object-fit: cover;
        }
    </style>
    
    <script>
        // Carga inmediata del estado inicial para evitar destellos blancos
        if (localStorage.getItem('tema') === 'noche') {
            document.documentElement.classList.add('modo-noche');
        }
    </script>
</head>
<body>

    <!-- Botón para alternar entre Día y Noche -->
    <div class="contenedor-tema">
        <button id="btnTema" class="btn-tema">🌙 Modo Noche</button>
    </div>

    <ul type="square">
		
		<br>
		<li><a href="timer.html" target="contenido">Timer</a></li>
        <br>
		<li><a href="noticias.html" target="contenido">Noticias</a></li>
        <br>
        <hr>
        <p><b>Selecciona el cubo que quieres aprender a resolver:</b></p>
        <hr><br>
        
        <li><a href="conceptos.html" target="contenido">Conceptos básicos</a></li>
        <br>
        <li><a href="notacion.html" target="contenido">Notación</a></li>
        <br>
        <li><a href="2x2.html" target="contenido">2x2x2</a> <img src="img/2x2.png" width="60" height="55" alt="2x2"></li>
        <br>
        <li><a href="3x3.html" target="contenido">3x3x3</a> <img src="img/3x3.png" width="55" height="55" alt="3x3"></li>
        <br>
        <li><a href="4x4.html" target="contenido">4x4x4</a> <img src="img/4x4.png" width="55" height="55" alt="4x4"></li>
        <br>
        <li><a href="5x5.html" target="contenido">5x5x5</a> <img src="img/5x5.png" width="60" height="55" alt="5x5"></li>
        <br>
        <li><a href="pyraminx.html" target="contenido">Pyraminx</a> <img src="img/pyraminx.png" width="55" height="55" alt="Pyraminx"></li>
        <br>
        <li><a href="megaminx.html" target="contenido">Megaminx</a> <img src="img/megaminx.png" width="55" height="55" alt="Megaminx"></li>
        <br><hr><hr><br>
        
    </ul>

    <script>
        const btnTema = document.getElementById('btnTema');
        const canalTema = new BroadcastChannel('canal_tema_web');

        function actualizarEstadoBoton(esNoche) {
            if (esNoche) {
                document.body.classList.add('modo-noche');
                document.documentElement.classList.add('modo-noche');
                btnTema.textContent = '☀️ Modo Día';
            } else {
                document.body.classList.remove('modo-noche');
                document.documentElement.classList.remove('modo-noche');
                btnTema.textContent = '🌙 Modo Noche';
            }
        }

        // Cargar estado inicial
        const temaInicial = localStorage.getItem('tema') === 'noche';
        actualizarEstadoBoton(temaInicial);

        // Al hacer clic, enviamos la señal por el canal global
        btnTema.addEventListener('click', () => {
            const esNocheActual = document.body.classList.contains('modo-noche');
            const nuevoEstado = !esNocheActual;

            localStorage.setItem('tema', nuevoEstado ? 'noche' : 'dia');
            actualizarEstadoBoton(nuevoEstado);

            // Transmitir orden a todas las demás partes/páginas abiertas
            canalTema.postMessage({ modoNoche: nuevoEstado });
        });

        // Escuchar por si otra página cambia el estado
        canalTema.onmessage = (e) => {
            if (e.data && typeof e.data.modoNoche === 'boolean') {
                actualizarEstadoBoton(e.data.modoNoche);
            }
        };
    </script>
</body>
</html>
