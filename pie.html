<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>pie</title>

    <style>
        /* Variables para el Tema Claro (Día) */
        :root {
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --title-color: #0284c7;
            --link-color: #0284c7;
            --link-hover: #0369a1;
        }

        /* Variables para el Tema Oscuro (Noche) */
        body.modo-noche {
            --bg-color: #0f172a;
            --text-color: #ffffff;
            --title-color: #38bdf8;
            --link-color: #38bdf8;
            --link-hover: #7dd3fc;
        }

        html.modo-noche {
            background-color: #0f172a;
            color: #ffffff;
        }

        /* Estilos base */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h2 {
            color: var(--title-color);
            margin: 0;
            transition: color 0.3s ease;
        }

        p {
            margin: 0;
            line-height: 1.5;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        img {
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }

        table {
            border-collapse: collapse;
        }

        td {
            vertical-align: middle;
        }
    </style>

    <script>
        // Carga e inicialización inmediata antes de renderizar
        if (localStorage.getItem('tema') === 'noche') {
            document.documentElement.classList.add('modo-noche');
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('modo-noche');
            });
        }
    </script>
</head>
<body>

    <table align="center" cellpadding="8">
        <tr>
            <td><h2>DONACIONES:</h2></td>
            <td><p><b>Si el contenido de esta página web te ha ayudado, puedes hacer una donación al creador, porque así podrá mejorar y actualizar el contenido. Muchas gracias :)</b></p></td>
            <td>
                <a href="https://www.paypal.com/qrcodes/p2pqrc/NCNDSJVPZML5C" target="_blank">
                    <img src="img/paypal.jpg" width="200" height="200" alt="Código QR PayPal">
                </a>
            </td>
            <td>
                <a href="https://www.paypal.com/qrcodes/p2pqrc/NCNDSJVPZML5C" target="_blank">Click aquí para hacer donación :)</a>
            </td>
        </tr>
    </table>

    <script>
        // Sincronización mediante BroadcastChannel con el botón del Navegador
        const canalTema = new BroadcastChannel('canal_tema_web');

        function aplicarTema(esNoche) {
            if (esNoche) {
                document.body.classList.add('modo-noche');
                document.documentElement.classList.add('modo-noche');
            } else {
                document.body.classList.remove('modo-noche');
                document.documentElement.classList.remove('modo-noche');
            }
        }

        // Escuchar la orden emitida desde navegadir.html
        canalTema.onmessage = (e) => {
            if (e.data && typeof e.data.modoNoche === 'boolean') {
                aplicarTema(e.data.modoNoche);
            }
        };
    </script>
</body>
</html>
